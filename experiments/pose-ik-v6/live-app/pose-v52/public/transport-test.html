<!doctype html><meta charset="utf-8"><title>RGBA / PNG transport equivalence check</title><h1>RGBA / PNG transport equivalence check</h1><p id="state">Running pixel validation only, no model inference.</p><canvas id="view"></canvas><script type="module">
const video=document.createElement('video');video.muted=true;video.src='/assets/videos/candidates-commons/jumping-jacks-burpees-20s.mp4';const canvas=document.getElementById('view');
const b64=async blob=>new Promise(resolve=>{const r=new FileReader;r.onload=()=>resolve(r.result.split(',')[1]);r.readAsDataURL(blob)});
video.requestVideoFrameCallback(async(now,meta)=>{video.pause();canvas.width=512;canvas.height=384;const ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true,colorSpace:'srgb'});ctx.drawImage(video,0,0,512,384);const rgba=ctx.getImageData(0,0,512,384).data;const png=await new Promise(r=>canvas.toBlob(r,'image/png'));const result={test:'same exact canvas pixel validation; no pose inference',width:512,height:384,source_pts_ms:meta.mediaTime*1000,rgba_base64:await b64(new Blob([rgba])),png_base64:await b64(png)};const response=await fetch('/save-results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'transport-equivalence',log:result})});document.getElementById('state').textContent=response.ok?'Saved same-canvas RGBA and PNG bytes for independent OpenCV RGB comparison.':'Save failed';});video.play();
</script>
